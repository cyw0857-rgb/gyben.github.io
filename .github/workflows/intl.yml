name: Intl Markets Update

on:
  schedule:
    - cron: '*/10 * * * *'   # 每10分鐘
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: pip install yfinance pandas --quiet

      - name: Fetch Intl Markets
        id: fetch
        run: |
          python intl_fetch.py
          if git diff --quiet -- data/intl.json 2>/dev/null && [ -f data/intl.json ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push if changed
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "Intl Bot"
          git config user.email "bot@github.com"
          git add data/intl.json
          git commit -m "Intl $(TZ='Asia/Taipei' date +'%H:%M') TST"
          git pull --rebase origin main || true
          git push origin main
