name: Intl Markets Update

on:
  schedule:
    - cron: '*/5 * * * *'    # 每5分鐘（瀏覽器 Yahoo API 失敗時的 fallback）
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: pip install yfinance pandas --quiet

      - name: Fetch Intl Markets
        run: python intl_fetch.py

      - name: Push (always — timestamp 永遠更新)
        run: |
          git config user.name "Intl Bot"
          git config user.email "bot@github.com"
          git add data/intl.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Intl $(TZ='Asia/Taipei' date +'%H:%M') TST"
          git pull --rebase origin main || true
          git push origin main
