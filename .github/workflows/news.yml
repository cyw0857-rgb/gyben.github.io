name: News Live Update

on:
  schedule:
    - cron: '*/15 * * * *'   # 每15分鐘（全天候）
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: pip install feedparser --quiet

      - name: Fetch News
        run: python news_fetch.py

      - name: Push (always — timestamp 永遠更新)
        run: |
          git config user.name "News Bot"
          git config user.email "bot@github.com"
          git add data/news.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "News $(TZ='Asia/Taipei' date +'%H:%M') TST"
          git pull --rebase origin main || true
          git push origin main
