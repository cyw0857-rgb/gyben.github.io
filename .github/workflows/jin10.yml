name: Jin10 Live News

on:
  schedule:
    - cron: '*/5 * * * *'   # 每5分鐘（GitHub Actions 可能延遲，最慢10分鐘一次）
  workflow_dispatch:         # 允許手動觸發

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: pip install requests --quiet

      - name: Fetch Jin10
        id: fetch
        run: |
          python jin10_fetch.py
          # 檢查檔案是否有變動
          if git diff --quiet -- data/jin10_news.json 2>/dev/null && [ -f data/jin10_news.json ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push if changed
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "Jin10 Bot"
          git config user.email "bot@github.com"
          git add data/jin10_news.json
          git commit -m "Jin10 $(TZ='Asia/Taipei' date +'%H:%M') TST"
          git pull --rebase origin main || true
          git push origin main
