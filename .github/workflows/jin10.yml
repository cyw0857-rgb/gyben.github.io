name: Jin10 Live News

on:
  schedule:
    - cron: '*/5 * * * *'   # 每5分鐘
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Jin10 news
        id: fetch
        run: |
          python jin10_fetch.py
          if git diff --quiet data/jin10_news.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "Jin10 Bot"
          git config user.email "bot@github.com"
          git add data/jin10_news.json
          git commit -m "Jin10 $(TZ='Asia/Taipei' date +'%H:%M') TST"
          git push
