name: Update Dashboard

on:
  schedule:
    # ── 台灣日盤 08:00-14:00 TST = UTC 00:00-06:00 ──────────────
    - cron: '*/5 0-5 * * 1-5'    # 每5分 週一~五（盤中即時）
    - cron: '45 5 * * 1-5'        # 13:45 TST
    - cron: '0 6 * * 1-5'         # 14:00 TST

    # ── 美股盤中 TST 22:30-04:00 = UTC 14:30-20:00 ───────────────
    - cron: '*/5 14-20 * * 0-4'   # 每5分 週日~週四 UTC (=TST 週一~週五凌晨)

    # ── 每日 06:00 TST (UTC 22:00) 盤後摘要 ──────────────────────
    - cron: '0 22 * * *'           # 每天 06:00 TST

  workflow_dispatch:               # 手動觸發

# 同時間只跑一個，避免 */5 排程互相堆疊
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei              # 資料時間戳用台灣時間，不要 UTC（避免看起來慢一截像沒更新）
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy feedparser requests beautifulsoup4 --quiet

      - name: Run signal engine + dashboard
        run: python run.py morning

      - name: Commit and push
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@github.com"

          # news.json / intl.json / jin10_news.json 各自有獨立的 news.yml / intl.yml /
          # jin10.yml 每 5~15 分鐘專職 commit+push。這個 job 執行較久（裝套件+抓籌碼+算信號），
          # 若連這三個檔案也一起提交，push 前遠端幾乎一定已被那三支搶先動過，
          # rebase 衝突後 push 必失敗（8/7 起台指期信號卡住的原因）。這裡還原、不提交它們，
          # 交給專職 workflow 管。
          git checkout -- data/news.json data/intl.json data/jin10_news.json 2>/dev/null || true

          git add index.html data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Auto update $(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M') TST"

          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "attempt $i failed, retrying in $((i*8))s..."
            sleep $((i*8))
          done
          echo "::error::push failed after 5 retries"
          exit 1
